name: Build SukiSU Kernel for nabu (4.14.180)

# ============================================================================
# 为小米平板 5 (nabu) 编译内置 SukiSU 的内核
#
# 目标内核: Linux 4.14.180 (小米官方 MiCode/Xiaomi_Kernel_OpenSource, 分支 nabu-r-oss)
#           —— 已与设备运行内核对比, defconfig 仅 22 项差异, 同一源码血缘
# root 方案: SukiSU-Nova builtin 分支 (无需 CONFIG_KPROBES, 适配 4.14 non-GKI)
# 手动 hook: 6 个点 (faccessat / execveat / stat / vfs_read / reboot / input)
#
# 使用方法:
#   1. 把本文件放到你仓库的 .github/workflows/build-kernel.yml
#   2. 把 patches/ksu-hooks.patch 放到仓库根目录的 patches/ 下
#   3. GitHub 网页 -> Actions -> 选本 workflow -> Run workflow
#   4. 约 40-60 分钟后下载 artifact: sukisu-nabu-kernel
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      sukisu_ref:
        description: 'SukiSU-Nova 分支/标签 (builtin = 4.14 non-GKI 专用)'
        required: true
        default: 'builtin'
      enable_kpm:
        description: '启用 KPM 内核补丁模块 (CONFIG_KPM=y, 可能降低稳定性)'
        type: boolean
        default: false
      enable_susfs:
        description: '启用 SUSFS (需要额外集成 fs/susfs.c, 默认关闭!)'
        type: boolean
        default: false

env:
  KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: nabu-r-oss
  DEFCONFIG: nabu_user_defconfig   # 仅作源码完整性校验, 实际用 config/nabu_device_defconfig
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04          # 22.04 才有 libtinfo5 / lib32ncurses5-dev
    timeout-minutes: 240

    steps:
      - name: Checkout build repo (patches/config/tools)
        uses: actions/checkout@v4

      - name: Checkout kernel source
        run: |
          set -eux
          git clone -b "${KERNEL_BRANCH}" --depth=1 "${KERNEL_REPO}" kernel
          cd kernel
          echo "=== commit ==="
          git log --oneline -1
          echo "=== version ==="
          head -5 Makefile
          echo "=== defconfig exists? ==="
          ls -l arch/arm64/configs/${DEFCONFIG}

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev libtinfo5 libncurses5 device-tree-compiler python3 \
            wget unzip

      - name: Download Proton Clang 12.0.0 toolchain
        run: |
          set -eux
          # 原内核由 proton clang 12.0.0 + LLD 20240802 编译, 用同代工具链最稳
          # 注意: proton-clang 没有 20210208 这个 tag, 只有 20201226/20210102/
          #       20210109/20210116/20210123 这几个才是 Clang 12.0.0 (20210130 起升 13)
          URL="https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210123.tar.gz"
          curl -fL --retry 5 --retry-delay 3 "$URL" -o /tmp/proton.tar.gz
          mkdir -p "${GITHUB_WORKSPACE}/toolchain"
          tar -xzf /tmp/proton.tar.gz -C "${GITHUB_WORKSPACE}/toolchain" --strip-components=1
          ls "${GITHUB_WORKSPACE}/toolchain/bin" | head -20
          "${GITHUB_WORKSPACE}/toolchain/bin/clang" --version

      - name: Install host binutils (aarch64 + arm)
        run: |
          set -eux
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Integrate SukiSU (builtin branch)
        run: |
          set -eux
          cd kernel
          REF="${{ github.event.inputs.sukisu_ref }}"
          echo "SukiSU ref = $REF"
          # 注意: 必须用 builtin 分支的 setup.sh, 不能用 main 的!
          #   main 版 setup.sh 里 git clone 的地址是第三方私有服务器
          #   git.zako.shirkneko.top:20004/shirkneko/SukiSU —— GitHub Actions
          #   根本连不上, 会在这一步直接超时失败。
          #   builtin 版 setup.sh 用的才是官方 github.com/SukiSU-Nova/SukiSU-Nova。
          # setup.sh 内部会: git clone SukiSU-Nova -> git checkout $REF
          #  -> 建立 drivers/kernelsu 软链 -> 改 drivers/Makefile + drivers/Kconfig
          curl -fLsS "https://raw.githubusercontent.com/SukiSU-Nova/SukiSU-Nova/builtin/kernel/setup.sh" -o /tmp/sukisu-setup.sh
          cat /tmp/sukisu-setup.sh | head -20
          sh /tmp/sukisu-setup.sh "$REF"
          echo "=== 验证集成 ==="
          test -d drivers/kernelsu
          grep -n "kernelsu" drivers/Makefile
          grep -n "kernelsu" drivers/Kconfig
          ls drivers/kernelsu | head

          # ---- 强校验: 必须真的在 builtin 分支上 ----
          # main 分支的 Kconfig 是 `depends on KPROBES && EXT4_FS`, 本内核
          # 没有 CONFIG_KPROBES, 一旦误检到 main, CONFIG_KSU 会静默失效
          # (olddefconfig 把它丢弃), 编译"成功"但产物里没有 KSU。
          echo "=== 校验 Kconfig 不含 KPROBES 依赖 ==="
          if grep -q "depends on KPROBES" drivers/kernelsu/Kconfig; then
            echo "!! 错误: drivers/kernelsu/Kconfig 里有 'depends on KPROBES'"
            echo "!! 说明检出的不是 builtin 分支（很可能是 main）"
            exit 1
          fi
          grep -n "^config KSU$" drivers/kernelsu/Kconfig
          echo "✅ Kconfig 正确（无 KPROBES 依赖）"

          # ---- 校验补丁依赖的 hook 函数签名存在 ----
          echo "=== 校验 hook 函数签名 ==="
          test -f drivers/kernelsu/feature/sucompat.h
          for fn in ksu_handle_faccessat ksu_handle_execveat ksu_handle_stat; do
            grep -q "$fn" drivers/kernelsu/feature/sucompat.h \
              || { echo "!! sucompat.h 里没有 $fn"; exit 1; }
          done
          grep -q "ksu_handle_vfs_read" drivers/kernelsu/runtime/ksud.h \
            || grep -rq "ksu_handle_vfs_read" drivers/kernelsu/ \
            || { echo "!! 找不到 ksu_handle_vfs_read"; exit 1; }
          grep -rq "ksu_handle_sys_reboot" drivers/kernelsu/ \
            || { echo "!! 找不到 ksu_handle_sys_reboot"; exit 1; }
          grep -rq "ksu_handle_input_handle_event" drivers/kernelsu/ \
            || { echo "!! 找不到 ksu_handle_input_handle_event"; exit 1; }
          echo "✅ 6 个 hook 函数签名全部存在"

          # ---- 兼容 4.14: 移除 linux/static_call.h 的 include ----
          # SukiSU builtin 的 kernel_includes.h 无条件 include <linux/static_call.h>,
          # 但该头文件是 Linux 5.x 才引入的, 4.14 内核树里没有 -> fatal error。
          # 全源码里该头没有任何实际使用 (只此一处 include), 直接删掉即可。
          if [ ! -f include/linux/static_call.h ]; then
            echo "4.14 内核无 static_call.h, 移除 KSU 里的 include"
            sed -i '/#include <linux\/static_call.h>/d' drivers/kernelsu/kernel_includes.h
            ! grep -q "static_call.h" drivers/kernelsu/kernel_includes.h \
              || { echo "!! 移除 static_call.h include 失败"; exit 1; }
          fi

          # ---- 兼容 4.14: access_ok 参数数量 + kvcalloc 不存在 ----
          # kpm.c 用了 5.x 风格 access_ok(addr,size); 4.14 是 access_ok(type,addr,size)
          #   -> 改用源码自带的 ksu_access_ok 兼容宏 (kernel_compat.h, 会按 VERIFY_READ 展开)
          # dispatch.c 用了 kvcalloc (5.x 引入); 4.14 没有 -> 用 kcalloc (kvfree 可正确释放)
          if ! grep -q "ksu_access_ok(u64_to_user_ptr(cmd.result_code)" drivers/kernelsu/extension/kpm/kpm.c; then
            sed -i 's/access_ok(u64_to_user_ptr(cmd.result_code)/ksu_access_ok(u64_to_user_ptr(cmd.result_code)/' drivers/kernelsu/extension/kpm/kpm.c
          fi
          grep -q "ksu_access_ok(u64_to_user_ptr(cmd.result_code)" drivers/kernelsu/extension/kpm/kpm.c \
            || { echo "!! access_ok 兼容修复失败"; exit 1; }
          sed -i 's/kvcalloc(/kcalloc(/g' drivers/kernelsu/supercall/dispatch.c
          ! grep -q "kvcalloc" drivers/kernelsu/supercall/dispatch.c \
            || { echo "!! kvcalloc 兼容修复失败"; exit 1; }
          echo "✅ 4.14 access_ok / kvcalloc 兼容修复完成"

          # ---- ★ 内核版本伪装: 只对 bpfloader 这一个进程伪造 uname release ----
          # 设备是 ColorOS 15 (Android 15 / API 35), 其 netbpfload 读 uname() 的
          # release 字段, 若 kernel < 4.19 就打 "Android V requires kernel 4.19"
          # 并 exit(2), init 因 reboot_on_failure 执行 'reboot,bpfloader-failed'
          # -> 重启循环 -> 高通启动失败保护踢回 fastboot。
          #
          # 【关键】不能全局改 init_uts_ns.name.release:
          #   run11/run12 实测全局伪造 4.19.280 后内核能启动、KSU 正常、netbpfload
          #   也读到 kver:4130118, 但进程仍 exited with status 2 -> 因为内核里所有
          #   进程都看到 4.19, BPF 等子系统据此走 4.19 分支, 物理内核是 4.14 崩掉。
          #   正确做法 (KernelPatch/APatch 的实测手法, 已用 A/B 实验坐实): 只按
          #   ->comm 给 netbpfload/bpfloader 这一个进程返回 4.19.x, 其余进程仍看
          #   真实 4.14。同一二进制改名为 netbpfload 就成功、改名为别的就失败,
          #   与路径无关。
          PATCH_UNAME="${GITHUB_WORKSPACE}/patches/uname-percomm.patch"
          test -f "$PATCH_UNAME"
          # 注意: 补丁内路径是 a/kernel/sys.c, 必须在内核源码树的父目录用 -p1 应用。
          # 该步骤前面已 cd kernel, 所以这里用 -d "${GITHUB_WORKSPACE}" 指定父目录;
          # 之后的 grep 仍以 cwd(=kernel 源码树根) 为准, 路径写 sys.c / init/version.c。
          echo "=== uname per-comm dry-run ==="
          patch -p1 -d "${GITHUB_WORKSPACE}" --dry-run < "$PATCH_UNAME"
          echo "=== uname per-comm apply ==="
          patch -p1 -d "${GITHUB_WORKSPACE}" < "$PATCH_UNAME"
          grep -q "ksu_is_bpfloader_task" sys.c \
            || { echo "!! per-comm uname 伪装补丁未生效"; exit 1; }
          grep -q 'memcpy(tmp.release, "4.19.280-perf"' sys.c \
            || { echo "!! per-comm uname 伪装补丁未生效"; exit 1; }
          test -z "$(grep 'UTS_RELEASE' init/version.c | grep '4.19')" \
            || { echo "!! init/version.c 不应被全局篡改"; exit 1; }
          echo "✅ uname 仅对 netbpfload/bpfloader 进程伪装为 4.19.280-perf"

      - name: Apply KSU manual hooks patch
        run: |
          set -eux
          cd kernel
          PATCH="${GITHUB_WORKSPACE}/patches/ksu-hooks.patch"
          test -f "$PATCH"
          echo "=== dry-run ==="
          patch -p1 --dry-run < "$PATCH"
          echo "=== apply ==="
          patch -p1 < "$PATCH"
          echo "=== 验证 hook 调用 ==="
          grep -n "ksu_handle_" fs/open.c fs/exec.c fs/stat.c fs/read_write.c \
                          kernel/reboot.c drivers/input/input.c

      - name: Configure defconfig (device-accurate)
        run: |
          set -eux
          cd kernel
          export ARCH=arm64 SUBARCH=arm64
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # ---- 用设备真实 config 作为基线 ----
          # nabu_device_defconfig 来自设备 /proc/config.gz, 与当前运行内核
          # (4.14.180-uotan-ge6025c29a) 配置 100% 一致。
          # 相比 nabu_user_defconfig, 避免 olddefconfig 填 Kconfig 默认值带来的
          # 22 项差异 (IPA3/HZ_100/RNDIS_IPA/CC_OPTIMIZE_FOR_SIZE 等), 等价性更高。
          cp "${GITHUB_WORKSPACE}/config/nabu_device_defconfig" \
             arch/arm64/configs/nabu_device_defconfig
          make O=out ARCH=arm64 nabu_device_defconfig

          # ---- 追加/强制关闭 KSU 相关配置 ----
          # 注意: kernel/Kconfig 里 CONFIG_KSU_SUSFS 是 default y 且 depends on
          #       THREAD_INFO_IN_TASK, 而本设备 CONFIG_THREAD_INFO_IN_TASK=y,
          #       若不显式关闭, olddefconfig 会自动打开 SUSFS; 但 SUSFS 需要
          #       额外集成 fs/susfs.c (susfs4ksu), 本内核没有 -> 必然编译失败。
          #       另外 SUSFS 打开还会把 ksu_handle_faccessat/stat 的签名从
          #       (const char __user **) 改成 (struct filename **), 与补丁不符。
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "# CONFIG_KPROBES is not set"
            # ---- 禁用栈保护 (4.14 + clang 的 prepare-compiler-check 会因为
            #      -fstack-protector-strong 检测失败而中止; 该选项只是安全加固,
            #      不影响功能, 也不影响 KSU。追加在末尾覆盖 defconfig 里的强栈保护)
            echo "CONFIG_CC_STACKPROTECTOR_NONE=y"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_REGULAR is not set"
            # ---- 关闭 LAST_TOUCH_EVENTS ----
            # 小米 nabu-r-oss 的 drivers/input/input.c 在 CONFIG_LAST_TOUCH_EVENTS 下
            # 调用 touch_press_release_events_collect(), 但该函数在开源源码树里没有
            # 定义 (实现在闭源/遗漏文件里), 纯净源码编译会报 implicit declaration
            # 并被 -Werror 打断。这是"记录最后触摸事件"的调试特性, 与 root/KSU 无关,
            # 关掉宏即可 (调用点被 #ifdef 包住), 不影响触屏正常工作。
            echo "# CONFIG_LAST_TOUCH_EVENTS is not set"
            # ---- 隔离变量: 本 pstore 强化块已回退到 run9 状态 ----
            # run9 已验证能启动到 framework (pstore 里有 SukiSU banner + Nova
            # 授权记录), run11 同时加了 uname 伪装 + 本 pstore 块后卡米字。
            # 为定位卡米字根因, 这里去掉非必要的 pstore/PANIC_TIMEOUT/
            # DEBUG_INFO 改动, 只保留 uname 伪装这一个变量。
            # 设备 config.gz 里 PSTORE/RAM/CONSOLE/PMSG 本来就是 y, 无需重复加。
            if [ "${{ github.event.inputs.enable_susfs }}" != "true" ]; then
              echo "# CONFIG_KSU_SUSFS is not set"
            else
              echo "::warning::已选择启用 SUSFS, 但本内核未集成 fs/susfs.c, 编译很可能失败"
              echo "CONFIG_KSU_SUSFS=y"
            fi
            if [ "${{ github.event.inputs.enable_kpm }}" = "true" ]; then
              echo "CONFIG_KPM=y"
            else
              echo "# CONFIG_KPM is not set"
            fi
          } >> out/.config
          make O=out ARCH=arm64 olddefconfig
          echo "=== 关键配置确认 ==="
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_KPM=|CONFIG_KALLSYMS=|CONFIG_KPROBES|CONFIG_MODVERSIONS=|CONFIG_LOCALVERSION=" out/.config

          # ---- 强校验: CONFIG_KSU 必须存活 ----
          # 如果 Kconfig 没被正确 source, 或 builtin 分支没检出, olddefconfig 会
          # 静默丢弃 CONFIG_KSU, 编译照样"成功"但产物里没有 KSU。必须显式拦截。
          if ! grep -qx "CONFIG_KSU=y" out/.config; then
            echo "!! 致命: olddefconfig 后 out/.config 里没有 CONFIG_KSU=y"
            echo "!! 常见原因: drivers/kernelsu/Kconfig 没被 source, 或检出了 main 分支"
            echo "--- drivers/Kconfig 尾部 ---"
            tail -10 drivers/Kconfig
            echo "--- drivers/kernelsu/Kconfig 头 15 行 ---"
            head -15 drivers/kernelsu/Kconfig
            exit 1
          fi
          if grep -qx "CONFIG_KSU=m" out/.config; then
            echo "!! 错误: CONFIG_KSU 被设成了 m（模块），必须 =y（built-in）"
            exit 1
          fi
          grep -qx "# CONFIG_KSU_SUSFS is not set" out/.config \
            || echo "::warning::CONFIG_KSU_SUSFS 状态未知, 请检查"
          echo "✅ CONFIG_KSU=y 已确认"

      - name: Build kernel
        run: |
          set -eux
          # ---- 修正 proton-clang 自带的 as（智能分发 wrapper）----
          # 背景: 内核编译里有两种汇编需求, 必须用不同的 as:
          #   * 宿主工具 (scripts/kconfig/conf.o 等, HOSTCC=gcc): x86 汇编器, 认 --64
          #   * 目标代码 (scripts/mod/empty.o / vdso, CC=clang ARM64): 交叉汇编器, 认 -EL
          # proton-clang 20210123 的 bin/as 是 x86 的 (不认 -EL), 直接换成交叉 as 又会让
          # 宿主编译报 "--64 unrecognized"。所以放一个 wrapper 按参数自动分发。
          HOST_AS="$(command -v x86_64-linux-gnu-as || echo /usr/bin/as)"
          TARGET_AS="$(command -v aarch64-linux-gnu-as)"
          echo "host as    = $HOST_AS"
          echo "target as  = $TARGET_AS"
          mv "${GITHUB_WORKSPACE}/toolchain/bin/as" "${GITHUB_WORKSPACE}/toolchain/bin/as.orig" 2>/dev/null || true
          cat > "${GITHUB_WORKSPACE}/toolchain/bin/as" <<'ASEOF'
          #!/bin/sh
          # smart asm dispatcher: x86 host (--64/--32) vs arm64 target (default)
          for _a in "$@"; do
            case "$_a" in
              --64|--32|-m64|-m32|--x86-64) exec HOST_AS_PLACEHOLDER "$@" ;;
            esac
          done
          exec TARGET_AS_PLACEHOLDER "$@"
          ASEOF
          sed -i "s|HOST_AS_PLACEHOLDER|$HOST_AS|; s|TARGET_AS_PLACEHOLDER|$TARGET_AS|" \
            "${GITHUB_WORKSPACE}/toolchain/bin/as"
          chmod +x "${GITHUB_WORKSPACE}/toolchain/bin/as"
          "${GITHUB_WORKSPACE}/toolchain/bin/as" --version | head -1

          # ---- 同样的分发 wrapper 用于 ld ----
          # proton-clang 自带的 ld 也是 x86 的, 不认 ARM64 的 emulation
          # "aarch64linux"; 宿主工具(modpost)链接用 native ld, 目标(vdso/modules)
          # 链接用 aarch64-linux-gnu-ld。
          HOST_LD="$(command -v x86_64-linux-gnu-ld || echo /usr/bin/ld)"
          TARGET_LD="$(command -v aarch64-linux-gnu-ld)"
          echo "host ld    = $HOST_LD"
          echo "target ld  = $TARGET_LD"
          mv "${GITHUB_WORKSPACE}/toolchain/bin/ld" "${GITHUB_WORKSPACE}/toolchain/bin/ld.orig" 2>/dev/null || true
          cat > "${GITHUB_WORKSPACE}/toolchain/bin/ld" <<'LDEOF'
          #!/bin/sh
          # smart linker dispatcher: arm64 target (-m aarch64linux / -EL) vs x86 host
          for _a in "$@"; do
            case "$_a" in
              *aarch64*|-EL) exec TARGET_LD_PLACEHOLDER "$@" ;;
            esac
          done
          exec HOST_LD_PLACEHOLDER "$@"
          LDEOF
          sed -i "s|HOST_LD_PLACEHOLDER|$HOST_LD|; s|TARGET_LD_PLACEHOLDER|$TARGET_LD|" \
            "${GITHUB_WORKSPACE}/toolchain/bin/ld"
          chmod +x "${GITHUB_WORKSPACE}/toolchain/bin/ld"
          "${GITHUB_WORKSPACE}/toolchain/bin/ld" --version | head -1

          cd kernel
          export ARCH=arm64 SUBARCH=arm64
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="dsh"
          export KBUILD_BUILD_HOST="github-actions"
          set +e
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "make exit code = $RC"
          ls -la out/arch/arm64/boot/Image* 2>/dev/null || true
          if [ "$RC" != "0" ] || [ ! -f out/arch/arm64/boot/Image ]; then
            echo "=========== BUILD FAILED, last 200 lines ==========="
            tail -200 build.log
            echo "=========== error lines ==========="
            grep -nE "error:|Error [0-9]|undefined reference|No rule to make" build.log | head -50 || true
            exit 1
          fi

      - name: Verify KSU in Image
        run: |
          set -eux
          cd kernel
          IMG=out/arch/arm64/boot/Image
          ls -l "$IMG"
          echo "=== KernelSU 字符串数 ==="
          strings -a "$IMG" > /tmp/img.strings || true
          grep -c "KernelSU" /tmp/img.strings || echo 0
          echo "=== SukiSU 特征 ==="
          grep -c "SukiSU" /tmp/img.strings || echo 0
          echo "=== 关键串 ==="
          grep -E "KernelSU: boot_complete|ksu ioctl|drivers is disabled|KSU_VERSION" /tmp/img.strings | head -10 || true
          echo "=== 内核版本 ==="
          grep -E "^4\.14\.[0-9]+" /tmp/img.strings | head -3 || true

      - name: Package artifacts
        run: |
          set -eux
          cd kernel
          OUT="${GITHUB_WORKSPACE}/artifact"
          mkdir -p "$OUT"
          cp out/arch/arm64/boot/Image "$OUT/Image"
          [ -f out/arch/arm64/boot/Image.gz ]     && cp out/arch/arm64/boot/Image.gz     "$OUT/" || true
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb "$OUT/" || true
          [ -f out/arch/arm64/boot/dtb ]          && cp out/arch/arm64/boot/dtb          "$OUT/" || true
          [ -f out/arch/arm64/boot/dtb.img ]      && cp out/arch/arm64/boot/dtb.img      "$OUT/" || true
          cp out/.config "$OUT/config.txt"
          cp build.log   "$OUT/build.log"
          mkdir -p "$OUT/modules"
          find out -name "*.ko" -exec cp {} "$OUT/modules/" \; 2>/dev/null || true
          echo "=== artifact 内容 ==="
          ls -laR "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-nabu-kernel
          path: artifact/
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: |
            kernel/build.log
            kernel/out/.config
          retention-days: 7
          if-no-files-found: ignore
